name: termux-auto-release

on:
  push:
    paths:
      - ".github/termux-build-request.txt"
  schedule:
    # Check once daily. Never start a long Android build on every push.
    - cron: "23 2 * * *"
  workflow_dispatch:

concurrency:
  group: termux-auto-release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  resolve-v8:
    name: Resolve upstream V8 dependency
    runs-on: ubuntu-24.04
    outputs:
      v8_version: ${{ steps.resolve.outputs.v8_version }}
      build_v8: ${{ steps.resolve.outputs.build_v8 }}
    permissions:
      contents: read
    steps:
      - name: Resolve pinned V8 version and own prebuild
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$(gh api repos/openai/codex/releases/latest --jq '.tag_name')"
          [[ "${tag}" =~ ^rust-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          curl -fsSL "https://raw.githubusercontent.com/openai/codex/${tag}/codex-rs/Cargo.lock" -o Cargo.lock
          version="$(python3 - <<'PY'
          import tomllib
          with open("Cargo.lock", "rb") as file:
              lock = tomllib.load(file)
          versions = {p["version"] for p in lock["package"] if p["name"] == "v8"}
          if len(versions) != 1:
              raise SystemExit(f"Expected one V8 version: {versions}")
          print(next(iter(versions)))
          PY
          )"
          echo "v8_version=${version}" >> "${GITHUB_OUTPUT}"
          if gh release view "rusty-v8-v${version}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "build_v8=false" >> "${GITHUB_OUTPUT}"
          else
            echo "build_v8=true" >> "${GITHUB_OUTPUT}"
          fi

  build-v8:
    name: Build missing Android V8
    needs: resolve-v8
    if: ${{ needs.resolve-v8.outputs.build_v8 == 'true' }}
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/rusty-v8-android-release.yml
    with:
      v8_version: ${{ needs.resolve-v8.outputs.v8_version }}
      target: aarch64-linux-android
      sandbox: true
      publish_release: true

  prepare:
    name: Prepare upstream Termux candidate
    needs: [resolve-v8, build-v8]
    if: ${{ always() && needs.resolve-v8.result == 'success' && (needs.build-v8.result == 'success' || needs.build-v8.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    outputs:
      should_build: ${{ steps.prepare.outputs.should_build }}
      candidate_branch: ${{ steps.prepare.outputs.candidate_branch }}
      release_tag: ${{ steps.prepare.outputs.release_tag }}
      upstream_tag: ${{ steps.prepare.outputs.upstream_tag }}
      version: ${{ steps.prepare.outputs.version }}
      v8_version: ${{ steps.prepare.outputs.v8_version }}
    steps:
      - name: Checkout automation repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Prepare candidate from clean upstream release
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          upstream_tag="$(gh api repos/openai/codex/releases/latest --jq '.tag_name')"
          if ! [[ "${upstream_tag}" =~ ^rust-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Latest OpenAI Codex release is not a stable rust-vX.Y.Z tag: ${upstream_tag}" >&2
            exit 1
          fi

          version="${upstream_tag#rust-v}"
          release_tag="v${version}-termux.1"
          candidate_branch="auto/termux-v${version}"

          echo "upstream_tag=${upstream_tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "candidate_branch=${candidate_branch}" >> "${GITHUB_OUTPUT}"

          if gh release view "${release_tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${release_tag} already exists."
            echo "should_build=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # A scheduled run must never retry a failed version indefinitely.
          # A maintainer can explicitly retry with workflow_dispatch.
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ] \
            && gh api "repos/${GITHUB_REPOSITORY}/branches/${candidate_branch}" >/dev/null 2>&1; then
            echo "Candidate ${candidate_branch} already exists; skipping scheduled rebuild."
            echo "should_build=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream https://github.com/openai/codex.git
          else
            git remote add upstream https://github.com/openai/codex.git
          fi
          # The candidate starts from the official OpenAI release only.
          # Android patches are a fixed, audited file maintained in this fork.
          # No previous Termux release source is fetched or diffed.
          git fetch --force --no-tags upstream "refs/tags/${upstream_tag}:refs/tags/${upstream_tag}"
          cp patches/termux-runtime-compat.patch "${RUNNER_TEMP}/termux-runtime.patch"
          git checkout --detach "${upstream_tag}"
          if ! git apply --check "${RUNNER_TEMP}/termux-runtime.patch"; then
            echo "Android compatibility patch needs rebase onto ${upstream_tag}; stopping before build." >&2
            exit 1
          fi
          git apply "${RUNNER_TEMP}/termux-runtime.patch"

          # Apply the two Android-specific compatibility adjustments directly
          # against the current upstream layout, rather than replaying stale
          # whole-file patches across upstream Rust releases.
          python3 - <<'PY'
          from pathlib import Path

          p = Path("codex-rs/core/Cargo.toml")
          s = p.read_text()
          section = '[target.aarch64-linux-android.dependencies]\nopenssl-sys = { workspace = true, features = ["vendored"] }\n\n'
          if '[target.aarch64-linux-android.dependencies]' not in s:
              anchor = '[dev-dependencies]'
              if s.count(anchor) != 1:
                  raise SystemExit("core Cargo.toml Android dependency anchor mismatch")
              s = s.replace(anchor, section + anchor, 1)
          p.write_text(s)

          p = Path("codex-rs/arg0/src/lib.rs")
          s = p.read_text()
          helper = """fn is_unsupported_file_lock_error(err: &std::io::Error) -> bool {
              err.kind() == std::io::ErrorKind::Unsupported
          }

          """
          if "fn is_unsupported_file_lock_error(" not in s:
              anchor = 'const LOCK_FILENAME: &str = ".lock";'
              if s.count(anchor) != 1:
                  raise SystemExit("arg0 lock helper anchor mismatch")
              s = s.replace(anchor, anchor + "\n\n" + helper, 1)
          # Preserve the fork's stable executable path for Termux re-exec.
          if 'const CODEX_SELF_EXE_ENV:' not in s:
              s = s.replace('const LOCK_FILENAME: &str = ".lock";',
                            'const CODEX_SELF_EXE_ENV: &str = "CODEX_SELF_EXE";\nconst LOCK_FILENAME: &str = ".lock";', 1)
          if 'fn resolve_codex_self_exe()' not in s:
              anchor = 'fn linux_sandbox_exe_path('
              resolver = """fn resolve_codex_self_exe() -> Option<PathBuf> {
              std::env::var_os(CODEX_SELF_EXE_ENV)
                  .filter(|value| !value.is_empty())
                  .map(PathBuf::from)
                  .or_else(|| std::env::current_exe().ok())
          }

          """
              if s.count(anchor) != 1:
                  raise SystemExit("arg0 self executable resolver anchor mismatch")
              s = s.replace(anchor, resolver + anchor, 1)
          s = s.replace('let exe = std::env::current_exe()?;',
                        'let exe = resolve_codex_self_exe().ok_or(std::io::ErrorKind::NotFound)?;', 1)
          old = '    lock_file.try_lock()?;'
          new = """    if let Err(err) = lock_file.try_lock() {
              let io_err: std::io::Error = err.into();
              if !is_unsupported_file_lock_error(&io_err) {
                  return Err(io_err);
              }
          }"""
          if old in s:
              s = s.replace(old, new, 1)
          elif 'if let Err(err) = lock_file.try_lock()' not in s:
              raise SystemExit("arg0 try_lock anchor mismatch")
          old = '        Err(std::fs::TryLockError::WouldBlock) => Ok(None),'
          if old in s and 'if is_unsupported_file_lock_error(&io_err)' not in s:
              s = s.replace(old, old + """\n        Err(std::fs::TryLockError::Error(io_err)) if is_unsupported_file_lock_error(&io_err) => Ok(Some(lock_file)),""", 1)
          p.write_text(s)
          PY

          # Rebase two small Termux changes onto the current upstream API.
          # Never replay the old complete files: 0.162 changed socket locking
          # and remote-control command handling significantly.
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if text.count(old) != 1:
                  raise SystemExit(f"Termux rebase anchor mismatch: {label}")
              return text.replace(old, new, 1)

          p = Path("codex-rs/cli/src/remote_control_cmd.rs")
          s = p.read_text()
          s = replace_once(s, '.tempdir_in("/tmp")', '.tempdir_in(std::env::temp_dir())', "remote-control tempdir")
          p.write_text(s)

          p = Path("codex-rs/app-server-transport/src/transport/unix_socket.rs")
          s = p.read_text()
          s = replace_once(s, '        file.lock()?;', '\n'.join([
              '        if let Err(err) = file.lock()',
              '            && !is_unsupported_file_lock_error(&err)',
              '        {',
              '            return Err(err);',
              '        }',
          ]), "startup lock")
          s = replace_once(s, '    file.try_lock()?;', '\n'.join([
              '    if let Err(err) = file.try_lock()',
              '        && !matches!(err, std::fs::TryLockError::Error(ref e) if is_unsupported_file_lock_error(e))',
              '    {',
              '        return Err(match err {',
              '            std::fs::TryLockError::WouldBlock => ErrorKind::WouldBlock.into(),',
              '            std::fs::TryLockError::Error(err) => err,',
              '        });',
              '    }',
          ]), "removable startup lock")
          s = replace_once(s, '            Err(std::fs::TryLockError::Error(err)) => return Err(err),', '\n'.join([
              '            Err(std::fs::TryLockError::Error(err)) if is_unsupported_file_lock_error(&err) => return Ok(()),',
              '            Err(std::fs::TryLockError::Error(err)) => return Err(err),',
          ]), "cleanup lock")
          s = replace_once(s, '    socket_guard._startup_lock._file.unlock()?;', '\n'.join([
              '    if let Err(err) = socket_guard._startup_lock._file.unlock()',
              '        && !is_unsupported_file_lock_error(&err)',
              '    {',
              '        return Err(err);',
              '    }',
          ]), "unlock")
          anchor = '#[cfg(unix)]\nasync fn set_control_socket_permissions'
          helper = '''fn is_unsupported_file_lock_error(err: &std::io::Error) -> bool {
              err.kind() == ErrorKind::Unsupported
          }

          #[cfg(test)]
          mod unsupported_lock_helper_tests {
              use super::is_unsupported_file_lock_error;
              use std::io::ErrorKind;
              #[test]
              fn unsupported_kind_is_classified_as_unsupported_lock_error() {
                  assert!(is_unsupported_file_lock_error(&ErrorKind::Unsupported.into()));
              }
          }

          '''
          if "fn is_unsupported_file_lock_error(" in s:
              raise SystemExit("Termux lock helper already present; refusing duplicate insertion")
          s = replace_once(s, anchor, helper + anchor, "lock helper")
          p.write_text(s)
          PY

          # Deliberately keep the upstream TUI, doctor, and update code intact.
          # The Termux release is distributed via GitHub, without source overlays.

          # Fork-owned release infrastructure is maintained on our main branch,
          # not inherited from the historical source release.
          git checkout origin/main -- \
            npm-package/package.json \
            npm-package/bin \
            npm-package/scripts/postinstall_termux_launcher.js \
            codex-rs/.cargo/config.toml \
            README.md \
            docs/install.md \
            npm-package/README.md \
            npm-package/tests \
            BUILDING.md \
            LICENSE \
            NOTICE \
            npm-package/LICENSE \
            npm-package/NOTICE \
            verify-patches.sh \
            patches/README.md \
            patches/termux-runtime-compat.patch \
            scripts/verify-termux-runtime.sh \
            scripts/fetch_rusty_v8_android.py \
            scripts/ensure_rusty_v8_android.py \
            scripts/prepare_rusty_v8_android_source.py \
            scripts/patch_rusty_v8_android_bindgen.py \
            scripts/build_rusty_v8_android.sh \
            scripts/check_v8_sandbox.py \
            third_party/v8/android-artifacts.toml

          # Keep this fork's automation files. Upstream/source workflow files
          # are never part of the compatibility delta.
          git rm -r -f --ignore-unmatch .github/workflows
          git checkout origin/main -- .github/workflows
          git add \
            npm-package/bin \
            npm-package/scripts/postinstall_termux_launcher.js \
            codex-rs/.cargo/config.toml \
            patches/termux-runtime-compat.patch \
            scripts/verify-termux-runtime.sh \
            npm-package/package.json \
            README.md \
            docs/install.md \
            npm-package/README.md \
            BUILDING.md \
            LICENSE \
            NOTICE \
            npm-package/LICENSE \
            npm-package/NOTICE \
            verify-patches.sh \
            patches/README.md \
            patches/termux-runtime-compat.patch \
            scripts/verify-termux-runtime.sh \
            scripts/fetch_rusty_v8_android.py \
            scripts/prepare_rusty_v8_android_source.py \
            scripts/patch_rusty_v8_android_bindgen.py \
            scripts/build_rusty_v8_android.sh \
            scripts/check_v8_sandbox.py \
            third_party/v8/android-artifacts.toml \
            .github/workflows

          VERSION="${version}" UPSTREAM_TAG="${upstream_tag}" node <<'NODE'
          const fs = require("node:fs");
          const file = "npm-package/package.json";
          const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
          pkg.version = `${process.env.VERSION}-termux.1`;
          const marker = `upstream ${process.env.UPSTREAM_TAG}`;
          if (/upstream rust-v\d+\.\d+\.\d+/.test(pkg.description || "")) {
            pkg.description = pkg.description.replace(
              /upstream rust-v\d+\.\d+\.\d+/,
              marker,
            );
          } else {
            pkg.description = `OpenAI Codex CLI ${marker} packaged for Android Termux (ARM64).`;
          }
          fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + "\n");
          NODE

          mkdir -p .release
          cat > ".release/v${version}-termux.1.md" <<EOF
          # [${version}-termux.1]

          Termux / Android ARM64 build based on OpenAI Codex \`${upstream_tag}\`.
          EOF

          changelog_tmp="$(mktemp)"
          {
            printf '# [%s-termux.1]\n\n' "${version}"
            printf -- '- Automated Termux / Android ARM64 port of OpenAI Codex \`%s\`.\n\n' "${upstream_tag}"
            cat CHANGELOG.md
          } > "${changelog_tmp}"
          mv "${changelog_tmp}" CHANGELOG.md

          git add npm-package/package.json CHANGELOG.md ".release/v${version}-termux.1.md" .github/workflows

          # The Codex build must have an audited Android rusty_v8 prebuild.
          # Do not silently compile against an unpinned or non-sandbox V8.
          v8_version="$(python3 - <<'PY'
          import tomllib
          from pathlib import Path
          lock = tomllib.loads(Path("codex-rs/Cargo.lock").read_text())
          versions = sorted({p["version"] for p in lock["package"] if p["name"] == "v8"})
          if len(versions) != 1:
              raise SystemExit(f"expected one v8 version, got {versions}")
          print(versions[0])
          PY
          )"
          echo "v8_version=${v8_version}" >> "${GITHUB_OUTPUT}"

          # Missing versions are built once and published by our own V8 workflow.
          # The coordinator verifies both downloaded asset checksums before
          # pinning the version-specific manifest entry in this candidate.
          V8_VERSION="${v8_version}" python3 scripts/ensure_rusty_v8_android.py
          git add third_party/v8/android-artifacts.toml

          # Validate the compatibility contract before spending runner time on
          # the Android build. Cargo-backed checks remain enabled here.
          bash scripts/verify-termux-runtime.sh

          # Stage only the Rust runtime changes made by the pinned Android patch
          # and the small explicit compatibility adaptations.
          git add -u -- codex-rs

          # Verify the exact staged tree, not just the working directory.
          if ! git diff --quiet; then
            echo "Unstaged changes remain after preparing the release candidate:" >&2
            git diff --name-only >&2
            exit 1
          fi

          git commit --allow-empty -m "chore(termux): apply pinned Android patches to ${upstream_tag}"

          # Confirm the committed candidate still contains both compatibility shims.
          git show HEAD:codex-rs/cli/src/remote_control_cmd.rs | grep -q 'tempdir_in(std::env::temp_dir())'
          git show HEAD:codex-rs/app-server-transport/src/transport/unix_socket.rs | grep -q 'is_unsupported_file_lock_error'
          bash scripts/verify-termux-runtime.sh

          # Push only a disposable candidate branch. main stays an automation/
          # maintenance branch; the successful release tag is the immutable
          # source reference for distributed binaries.
          git push --force origin "HEAD:refs/heads/${candidate_branch}"

          echo "Candidate ${candidate_branch} prepared at $(git rev-parse HEAD)"
          echo "should_build=true" >> "${GITHUB_OUTPUT}"

  build-release:
    name: Build and publish Termux release
    needs: prepare
    if: ${{ needs.prepare.outputs.should_build == 'true' }}
    permissions:
      contents: write
    uses: ./.github/workflows/termux-auto-build.yml
    with:
      source_ref: ${{ needs.prepare.outputs.candidate_branch }}
      publish_release: true
      release_tag: ${{ needs.prepare.outputs.release_tag }}

  finish:
    name: Finalize automation
    needs:
      - prepare
      - build-release
    if: ${{ always() && needs.prepare.outputs.should_build == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_BRANCH: ${{ needs.prepare.outputs.candidate_branch }}
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      UPSTREAM_TAG: ${{ needs.prepare.outputs.upstream_tag }}
      BUILD_RESULT: ${{ needs.build-release.result }}
    steps:
      - name: Clean candidate branch after successful release
        if: ${{ env.BUILD_RESULT == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method DELETE             "repos/${GITHUB_REPOSITORY}/git/refs/heads/${CANDIDATE_BRANCH}" || true

      - name: Report build failure
        if: ${{ env.BUILD_RESULT != 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          title="Termux auto-build failed for ${UPSTREAM_TAG}"
          if [[ "$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.has_issues')" == "true" ]] && ! gh issue list --repo "${GITHUB_REPOSITORY}" --state open --limit 100 --json title --jq '.[].title' | grep -Fxq "${title}"; then
            gh issue create --repo "${GITHUB_REPOSITORY}"               --title "${title}"               --body "The automatic Termux build for **${UPSTREAM_TAG}** failed. The candidate branch **${CANDIDATE_BRANCH}** was kept for inspection. Workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          fi

  report-prepare-failure:
    name: Report sync failure
    needs: prepare
    if: ${{ always() && needs.prepare.result == 'failure' }}
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Open one actionable issue
        shell: bash
        run: |
          set -euo pipefail
          upstream_tag="$(gh api repos/openai/codex/releases/latest --jq '.tag_name' 2>/dev/null || echo unknown)"
          title="Termux auto-sync failed for ${upstream_tag}"
          if [[ "$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.has_issues')" == "true" ]] && ! gh issue list --repo "${GITHUB_REPOSITORY}" --state open --limit 100 --json title --jq '.[].title' | grep -Fxq "${title}"; then
            gh issue create --repo "${GITHUB_REPOSITORY}"               --title "${title}"               --body "Automatic upstream synchronization failed before the Termux build could start. The workflow ports the published Termux release delta onto the new official stable tag and fails closed if that delta no longer applies, the patch contract is broken, or a new rusty_v8 Android prebuild is required. Workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          fi
